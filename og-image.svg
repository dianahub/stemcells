<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Stem Cell Connect Miami — stem cell consultations in Miami">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14304d"/>
      <stop offset="1" stop-color="#1b2a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative cell motif -->
  <g fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2">
    <circle cx="980" cy="315" r="230"/>
    <circle cx="980" cy="315" r="150"/>
  </g>
  <g>
    <circle cx="905" cy="235" r="34" fill="#cf9f3f"/>
    <circle cx="1035" cy="270" r="22" fill="#ffffff" opacity="0.9"/>
    <circle cx="960" cy="360" r="46" fill="#ffffff" opacity="0.65"/>
    <circle cx="1055" cy="390" r="18" fill="#cf9f3f" opacity="0.85"/>
    <circle cx="895" cy="405" r="14" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(90,86)">
    <circle cx="14" cy="30" r="14" fill="#ffffff"/>
    <circle cx="42" cy="14" r="11" fill="#cf9f3f"/>
    <circle cx="46" cy="42" r="8" fill="rgba(255,255,255,0.55)"/>
    <text x="80" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#ffffff">Stem Cell Connect Miami</text>
  </g>

  <!-- headline -->
  <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#ffffff">Stem Cell</text>
  <text x="90" y="386" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#ffffff">Consultations, Miami</text>

  <!-- supporting line -->
  <text x="92" y="452" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.82)">Same-day, own-fat procedures for joint pain &amp; hair thinning.</text>
  <text x="92" y="492" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.82)">Free video consultations.</text>

  <rect x="92" y="536" width="150" height="6" rx="3" fill="#cf9f3f"/>
</svg>
